# Global settings. Every value can be overridden on the CLI with --set key.path=value.
# Relative paths resolve against the project root.

seed: 42

paths:
  data_dir: data            # raw downloads + built databases (gitignored)
  runs_dir: runs            # traces, results, summaries (gitignored)
  datasets_dir: datasets    # dataset definitions and test suites (versioned)
  prompts_dir: prompts      # versioned prompts and tool descriptions
  profiles_dir: configs/agents

cache:
  enabled: true
  path: runs/cache/llm.sqlite

# Defaults every agent profile inherits; a profile overrides only what it changes.
agent_defaults:
  llm:
    model: anthropic/claude-sonnet-5-5
    temperature: 0.0
    max_tokens: 2048
  limits:
    max_steps: 15             # LLM turns per question
    max_cost_usd: 0.50        # budget per question
    max_clarifications: 2     # ask_user calls per question
    sql_max_rows: 200         # rows returned to the model per query
    sql_timeout_s: 10.0
    max_output_chars: 8000    # cap on one tool result shown to the model

simulated_user:
  llm:
    model: anthropic/claude-haiku-5-5   # deliberately a different model from the agent
    temperature: 0.0
    max_tokens: 512
  prompt: sim_user/v1

dataset: northwind
default_profile: full

# USD per million tokens. Used only when LiteLLM's built-in price table lacks a model.
prices: {}
#  anthropic/claude-sonnet-5-5: {input_per_mtok: 3.0, output_per_mtok: 15.0}

[project]
name = "askoract"
version = "0.1.0"
description = "A SQL data-analyst agent that knows when to answer, when to ask, and when to say no, plus an evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
askoract = "askoract.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askoract"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs internet access",
    "llm: test calls a real LLM API (needs API key)",
]
